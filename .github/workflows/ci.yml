name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Cancel superseded runs on the same ref (e.g. rapid PR pushes).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Puppet 8.11+ and Puppet 9 gems are only published to the authenticated
# puppetcore gem source. Store a Forge API key as the PUPPET_FORGE_TOKEN
# repository secret. Without it (e.g. PRs from forks) jobs fall back to the
# last public Puppet 8 gem and the Puppet 9 job is skipped.
env:
  BUNDLE_RUBYGEMS___PUPPETCORE__PUPPET__COM: ${{ secrets.PUPPET_FORGE_TOKEN && format('forge-key:{0}', secrets.PUPPET_FORGE_TOKEN) || '' }}

jobs:
  validate:
    name: PDK validate (metadata, tasks, rubocop)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install PDK
        run: gem install pdk

      - name: Use public gems when puppetcore credentials are unavailable
        if: env.BUNDLE_RUBYGEMS___PUPPETCORE__PUPPET__COM == ''
        run: |
          pdk bundle config set --local gemsource.public true
          echo "PUPPET_GEM_VERSION=8.10.0" >> "$GITHUB_ENV"

      - name: Install module dependencies
        run: pdk bundle install

      - name: Validate (ruby, metadata, tasks)
        run: pdk validate --format text --parallel

  unit:
    name: Unit tests (Puppet ${{ matrix.puppet_version }}, Ruby ${{ matrix.ruby_version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Module supports puppet >= 8.0.0 < 10.0.0 (see metadata.json). Ruby
        # versions match those bundled with the corresponding puppet-agent.
        include:
          - puppet_version: '8'
            puppet_gem_version: '~> 8.0'
            ruby_version: '3.2'
          - puppet_version: '9'
            puppet_gem_version: '~> 9.0'
            ruby_version: '4.0'
    env:
      PUPPET_GEM_VERSION: ${{ matrix.puppet_gem_version }}
    steps:
      - name: Checkout
        if: matrix.puppet_version != '9' || env.BUNDLE_RUBYGEMS___PUPPETCORE__PUPPET__COM != ''
        uses: actions/checkout@v4

      - name: Set up Ruby
        if: matrix.puppet_version != '9' || env.BUNDLE_RUBYGEMS___PUPPETCORE__PUPPET__COM != ''
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby_version }}
          bundler-cache: false

      - name: Use public gems when puppetcore credentials are unavailable
        if: matrix.puppet_version == '8' && env.BUNDLE_RUBYGEMS___PUPPETCORE__PUPPET__COM == ''
        run: |
          bundle config set --local gemsource.public true
          echo "PUPPET_GEM_VERSION=8.10.0" >> "$GITHUB_ENV"

      - name: Install module dependencies
        if: matrix.puppet_version != '9' || env.BUNDLE_RUBYGEMS___PUPPETCORE__PUPPET__COM != ''
        run: bundle install --jobs 4 --retry 3

      - name: Unit tests
        if: matrix.puppet_version != '9' || env.BUNDLE_RUBYGEMS___PUPPETCORE__PUPPET__COM != ''
        run: bundle exec rake spec

      - name: Skipped (no puppetcore credentials)
        if: matrix.puppet_version == '9' && env.BUNDLE_RUBYGEMS___PUPPETCORE__PUPPET__COM == ''
        run: echo "::warning::Puppet 9 unit tests skipped - set the PUPPET_FORGE_TOKEN secret to enable them."
